<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Application Form</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    fieldset {
      display: grid;
      gap: 1rem;
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 1rem;
    }

    label {
      display: grid;
      gap: 0.35rem;
    }

    input {
      box-sizing: border-box;
      width: 100%;
      padding: 0.6rem;
    }

    button {
      padding: 0.7rem 1rem;
      cursor: pointer;
    }

    #success {
      color: #176b32;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h1>Application Form</h1>

  <form id="application-form">
    <label>
      First Name
      <input name="firstName" autocomplete="given-name" required>
    </label>

    <label>
      Last Name
      <input name="lastName" autocomplete="family-name" required>
    </label>

    <fieldset>
      <legend>Address</legend>

      <label>
        Line 1
        <input name="addressLine1" autocomplete="address-line1" required>
      </label>

      <label>
        Line 2
        <input name="addressLine2" autocomplete="address-line2">
      </label>

      <label>
        City
        <input name="city" autocomplete="address-level2" required>
      </label>

      <label>
        State (two-letter code)
        <input
          name="state"
          autocomplete="address-level1"
          pattern="[A-Za-z]{2}"
          title="Enter a two-letter state code"
          maxlength="2"
          required
        >
      </label>

      <label>
        Zip/Postal Code
        <input name="zip" autocomplete="postal-code" required>
      </label>

      <label>
        Country
        <input name="country" value="US" readonly>
      </label>
    </fieldset>

    <label>
      SSN (9 digits, no dashes)
      <input
        name="ssn"
        inputmode="numeric"
        autocomplete="off"
        pattern="[0-9]{9}"
        title="Enter exactly 9 digits with no dashes"
        maxlength="9"
        required
      >
    </label>

    <label>
      Email Address
      <input
        type="email"
        name="email"
        autocomplete="email"
        required
      >
    </label>

    <label>
      Date of Birth (YYYY-MM-DD)
      <input
        type="text"
        name="dateOfBirth"
        placeholder="YYYY-MM-DD"
        pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}"
        title="Enter the date in YYYY-MM-DD format"
        required
      >
    </label>

    <button type="submit">Submit Application</button>
    <p id="success" role="status" aria-live="polite"></p>
  </form>

  <script>
    const form = document.getElementById("application-form");
    const successMessage = document.getElementById("success");

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      const state = form.elements.state.value;
      const dob = form.elements.dateOfBirth.value;

      // Check that the date is a real calendar date, not just correctly formatted.
      const [year, month, day] = dob.split("-").map(Number);
      const date = new Date(Date.UTC(year, month - 1, day));
      const validDate =
        date.getUTCFullYear() === year &&
        date.getUTCMonth() === month - 1 &&
        date.getUTCDate() === day;

      if (!/^[A-Za-z]{2}$/.test(state) || !validDate) {
        form.reportValidity();
        return;
      }

      successMessage.textContent = "Application Submitted Successfully";
      form.reset();
      form.elements.country.value = "US";
    });
  </script>
</body>
</html>
